              'b1ea1242026b62f7af047e6e9d11381d9bfeacd0d3dfcaaacd703d9f6e53d43f',
              '8cfb009739614723e2f7fdcd4b2dae364f155d6679493a5974a2ee593bf2b230',
              'c3084a6cebf714db2760ccd6021bf856cefc1455515432380897bf08cb8f8bc6',
              'c5e21b1e02caec4175cb7b86a3b4d0d3b1437975eeeba0b3f2ffd9284032fe19',
              '45f8a67216b3739fdecd6dddde3cae003ebd9d2d29c08b1c0dd5979aa217e87e',
          }
          with po.open("rb") as stream:
              catalog = read_po(stream, locale="fr", domain="deafrica_tools")
          exempted = 0
          for message in catalog:
              digest = hashlib.sha256(json.dumps(
                  [message.id, message.string, message.context],
                  ensure_ascii=False,
              ).encode()).hexdigest()
              if digest in reviewed:
                  message.flags.discard("python-format")
                  exempted += 1
          errors = list(catalog.check())
          for message, issues in errors:
              for issue in issues:
                  print(f"{po}:{message.lineno}: {issue}")
          if errors:
              raise SystemExit(f"{len(errors)} invalid translation entries")
          temporary = mo.with_suffix(".mo.tmp")
          try:
              with temporary.open("wb") as stream:
                  write_mo(stream, catalog)
              os.replace(temporary, mo)
          finally:
              temporary.unlink(missing_ok=True)
          print(f"Compiled {mo}; {exempted} reviewed percentage entries exempted")
          PYCOMPILE

      - name: Commit translation updates
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            Tools/deafrica_tools/locales/fr/LC_MESSAGES/deafrica_tools.po \
            Tools/deafrica_tools/locales/fr/LC_MESSAGES/deafrica_tools.mo

          if git diff --cached --quiet; then
            echo "No French translation changes were found."
          else
            git commit -m "Auto-update deafrica-tools French translations"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
