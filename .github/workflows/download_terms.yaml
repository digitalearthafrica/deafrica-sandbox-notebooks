name: Download French Translations from POEditor

on:
  push:
    branches:
      - main
    paths:
      - "Tools/**"
      - ".github/workflows/scripts/download_terms.py"
      - ".github/workflows/download_terms.yml"

  workflow_dispatch:

# Required because the workflow commits and pushes files.
permissions:
  contents: write

# Prevent two translation-update jobs from pushing simultaneously.
concurrency:
  group: poeditor-french-download-${{ github.ref }}
  cancel-in-progress: true

jobs:
  download:
    name: Download French translations from POEditor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10.6"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install poeditor babel

      - name: Download and compile French translations
        env:
          POEDITOR_API_TOKEN: ${{ secrets.POEDITOR_API_TOKEN }}
          POEDITOR_PROJECT_ID: "715168"
        run: |
          set -euo pipefail

          python .github/workflows/scripts/download_terms.py

          # Compile the French PO file into a binary MO file.
          pybabel compile \
            --directory Tools/deafrica_tools/locales \
            --locale fr \
            --domain deafrica_tools

      - name: Commit translation updates
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            Tools/deafrica_tools/locales/fr/LC_MESSAGES/deafrica_tools.po \
            Tools/deafrica_tools/locales/fr/LC_MESSAGES/deafrica_tools.mo

          if git diff --cached --quiet; then
            echo "No French translation changes were found."
          else
            git commit -m "Auto-update deafrica-tools French translations"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
