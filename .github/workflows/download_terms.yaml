name: Download French Translations from POEditor

on:
  push:
    branches:
      - main
    paths:
      - "Tools/**"
      - ".github/workflows/scripts/download_terms.py"
      - ".github/workflows/download_terms.yml"

  workflow_dispatch:

# Required because the workflow commits and pushes files.
permissions:
  contents: write

# Prevent two translation-update jobs from pushing simultaneously.
concurrency:
  group: poeditor-french-download-${{ github.ref }}
  cancel-in-progress: true

jobs:
  download:
    name: Download French translations from POEditor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10.6"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install poeditor babel

      - name: Download and compile French translations
        env:
          POEDITOR_API_TOKEN: ${{ secrets.POEDITOR_API_TOKEN }}
          POEDITOR_PROJECT_ID: "715168"
        run: |
          set -euo pipefail

          python .github/workflows/scripts/download_terms.py

          python - <<'PYCOMPILE'
          import hashlib
          import json
          import os
          from pathlib import Path
          from babel.messages.pofile import read_po
          from babel.messages.mofile import write_mo

          po = Path("Tools/deafrica_tools/locales/fr/LC_MESSAGES/deafrica_tools.po")
          mo = po.with_suffix(".mo")
          # Reviewed literal-percentage documentation entries. Both source and
          # translation must match; new or changed entries retain normal checks.
          reviewed = {
              '3d2ae14a8f6131be9afc144b902744cf6af33770f5e65008e49968323179ff84',
              'afa80ee78e127377aaa5fc029fb39f7b965b2a6f5605383608828367d907ee82',
              '4713d6738f229638e270a982b6e0d1360a83d5448bea3e9c80254c019da74289',
              '8133dc60f9dda4f1ca701f0bba368a03aa8ecdd0a97137161769d5e277bee797',
              'd1b85297bbd74dcaf630fca18fc0e95c90af3367f9ec5107a196226f70f3cf71',
