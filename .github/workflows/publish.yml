name: Publish deafrica-tools to PyPI

on:
  # Publish when a deafrica-tools version tag is pushed.
  # Example: deafrica-tools-v0.3.1
  push:
    tags:
      - "deafrica-tools-v*"

  # Allows a manual release after the package version has been updated.
  workflow_dispatch:

jobs:
  build:
    name: Build deafrica-tools distributions
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: ./Tools

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Uses the latest available Python 3.10 patch release.
          python-version: "3.10"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build source distribution and wheel
        run: |
          rm -rf dist build
          python -m build --sdist --wheel --outdir dist/

      - name: Validate distributions
        run: |
          python -m twine check --strict dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: Tools/dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish deafrica-tools to PyPI
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/deafrica-tools

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
