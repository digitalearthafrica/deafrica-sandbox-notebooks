name: Trigger deafrica-docs Build

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trigger-deafrica-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trigger-build:
    name: Trigger Read the Docs build
    runs-on: ubuntu-latest

    steps:
      - name: Trigger deafrica-docs build
        env:
          RTD_BUILD_URL: ${{ secrets.RTD_WEBHOOK_URL }}
          RTD_TOKEN: ${{ secrets.RTD_TOKEN }}
        run: |
          set -euo pipefail

          response_file="$(mktemp)"

          http_status="$(
            curl \
              --silent \
              --show-error \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --request POST \
              --header "Authorization: Token ${RTD_TOKEN}" \
              "${RTD_BUILD_URL}"
          )"

          echo "Read the Docs response status: ${http_status}"

          if [[ -s "$response_file" ]]; then
            cat "$response_file"
          fi

          if [[ "$http_status" != "202" ]]; then
            echo "::error::Read the Docs did not accept the build request."
            exit 1
          fi

          echo "Read the Docs build triggered successfully."
